{% extends "base.html" %}
{% block title %}Crear cuenta · SusoMTG{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="eyebrow">Nuevo Planeswalker</span>
            <h1>Crear una cuenta</h1>
            <p>Regístrate en segundos con Google o con tu correo electrónico.</p>
        </div>

        <a href="{{ url_for('auth_google') }}" class="btn-google">
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3 14.7 2 12 2 6.5 2 2 6.5 2 12s4.5 10 10 10c5.8 0 9.6-4.1 9.6-9.8 0-.7-.1-1.2-.2-1.8H12z"/>
                <path fill="#34A853" d="M3.2 7.3l3.2 2.4C7.2 7.4 9.4 5.7 12 5.7c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3 14.7 2 12 2 8.2 2 4.9 4.2 3.2 7.3z"/>
                <path fill="#FBBC05" d="M12 22c2.6 0 4.8-.9 6.4-2.4l-3-2.5c-.8.6-1.9 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1l-3.2 2.5C4.9 19.8 8.2 22 12 22z"/>
                <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.2-.2-1.8H12v3.9h5.5c-.3 1.3-1.1 2.4-2.1 3.1l3 2.5c1.8-1.6 3.2-4.1 3.2-7.7z"/>
            </svg>
            <span>Registrarse con Google</span>
        </a>

        <div class="auth-separador">
            <span>o rellena tus datos</span>
        </div>

        <form method="post" action="{{ url_for('registro') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="campo-filtro">
                <label for="reg-nombre">Nombre de usuario</label>
                <input type="text" id="reg-nombre" name="nombre" placeholder="Ej. Suso, Urza, Jace..." value="{{ nombre }}" required maxlength="60" autocomplete="username">
            </div>

            <div class="campo-filtro">
                <label for="reg-email">Correo electrónico</label>
                <input type="email" id="reg-email" name="email" placeholder="tu@correo.com" value="{{ email }}" required autocomplete="email">
            </div>

            <div class="campo-filtro">
                <label for="reg-password">Contraseña (mínimo 6 caracteres)</label>
                <input type="password" id="reg-password" name="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>

            <div class="campo-filtro">
                <label for="reg-confirmar">Confirmar contraseña</label>
                <input type="password" id="reg-confirmar" name="confirmar" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-block">Crear cuenta</button>
        </form>

        <p class="auth-footer">
            ¿Ya tienes una cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a>
        </p>
    </div>
</div>
{% endblock %}
